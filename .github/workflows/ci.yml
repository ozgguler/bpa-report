name: Build and deploy

# Both delivery targets are updated from the same commit, so they can never
# drift apart:
#   • the hosted site  → Cloudflare Pages
#   • the local option → container image on GHCR
#
# Documentation-only changes trigger nothing (see `paths` below).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'serve.py'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bpa-report

jobs:
  # ── Hosted site ────────────────────────────────────────────────────────
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: workingDirectory MUST be `web`.
      # Cloudflare looks for `functions/` relative to the working directory,
      # not inside the deployed directory. Deploying from the repo root
      # succeeds silently but never compiles the relay — /api/* then falls
      # through to the static handler (POST /api/token → 405).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy . --project-name bpa-report --commit-dirty=true

      # A deploy that "succeeds" but leaves the relay uncompiled is the
      # failure mode this project has already hit once. Check it explicitly.
      - name: Verify the live site
        run: |
          set -e
          URL=https://bpa-report-dit.pages.dev
          sleep 10
          echo "— static —"
          for p in / /assets/app.js /lib/report.js; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$URL$p")
            echo "  $p → $c"; [ "$c" = "200" ] || exit 1
          done
          echo "— relay is actually compiled —"
          body=$(curl -s -X POST "$URL/api/token" \
                   -H 'Content-Type: application/json' -d '{}')
          echo "  /api/token → $body"
          echo "$body" | grep -q missing_credentials || {
            echo "RELAY NOT LIVE — functions/ was not compiled"; exit 1; }
          echo "— guard rails —"
          curl -s -X POST "$URL/api/upload" \
            -H 'X-Upload-Url: https://evil.example.com/x' -d x | grep -q bad_target
          curl -s "$URL/api/status?task=abc" | grep -q missing_token
          echo "  ok"

  # ── Container image: verify before publishing ──────────────────────────
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bpa-test .

      - name: Run it
        run: |
          docker run -d --name bpa -p 8080:8080 \
            --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL \
            bpa-test
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done

      - name: Static files
        run: |
          set -e
          for p in / /assets/app.css /assets/app.js /lib/tsf.js /lib/report.js; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$p")
            echo "  $p → $c"; [ "$c" = "200" ] || exit 1
          done

      - name: Relay guard rails
        run: |
          set -e
          curl -s -X POST localhost:8080/api/token -H 'Content-Type: application/json' \
            -d '{}' | grep -q missing_credentials
          curl -s -X POST localhost:8080/api/upload \
            -H 'X-Upload-Url: https://evil.example.com/x' -d x | grep -q bad_target
          curl -s -X POST localhost:8080/api/upload \
            -H 'X-Upload-Url: http://storage.googleapis.com/x' -d x | grep -q bad_target
          curl -s localhost:8080/api/status?task=abc | grep -q missing_token
          echo "  all guard rails hold"

      - name: Not running as root
        run: |
          u=$(docker exec bpa id -un)
          echo "  container user: $u"
          [ "$u" != "root" ] || exit 1

      - name: Logs
        if: always()
        run: docker logs bpa 2>&1 | tail -20

  # ── Publish the image only if the smoke test passed ────────────────────
  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD'}}

      # Multi-architecture, so the image runs on Intel and ARM alike —
      # something a local build on one machine cannot produce.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 8080:8080 ${{ env.IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
